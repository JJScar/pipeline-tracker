      <div class="sub">Logs your calls on agency cards and fills in Dials and Connects for you.</div>
      <div class="grid2">
        <div class="field"><label>Trellus login email</label><input name="trellus_user_email" type="email" value="${esc(s.trellus_user_email)}" ${s.trellus_email_locked ? "disabled title='On the shared tracker this is always your own email'" : ""} placeholder="you@company.com"></div>
        <div class="field"><label>Trellus API key</label><input name="trellus_api_key" type="password" autocomplete="off" placeholder="${esc(secretPh(tk, "Paste your Trellus API key"))}"></div>
      </div>
      <ol><li>Ask your team lead or Trellus admin for your Trellus API key.</li><li>Paste it above, click <b>Test</b>, then <b>Save</b>.</li></ol>
      <div class="row2"><button class="btn sm" data-test="trellus">Test</button><span class="test-msg"></span><span class="spacer"></span>${tk.source === "settings" ? `<button class="btn sm danger" data-clear="trellus_api_key">Remove key</button>` : ""}</div>
    </div>
    <div class="set-sec" data-svc="email">
      <h4>✉️ Work email ${badge(gp.set && s.email_address)}</h4>
      <div class="sub">Logs emails with your agencies, and moves cards to Info Sent / Submission In / Quoted when the email shows it. Read-only: it never sends, deletes or marks anything read.</div>
      <div class="grid2">
        <div class="field"><label>Work email (Gmail / Google Workspace)</label><input name="email_address" type="email" value="${esc(s.email_address)}" placeholder="you@company.com"></div>
        <div class="field"><label>Google app password</label><input name="google_app_password" type="password" autocomplete="off" placeholder="${esc(secretPh(gp, "16 letters, e.g. abcd efgh ijkl mnop"))}"></div>
      </div>
      <ol>
        <li>Open <a href="https://myaccount.google.com/apppasswords" target="_blank" rel="noopener">Google app passwords ↗</a> and sign in with your <b>work</b> account.</li>
        <li>Type a name like <i>Pipeline Tracker</i> and click <b>Create</b>.</li>
        <li>Copy the 16-letter password Google shows you, paste it above, click <b>Test</b>, then <b>Save</b>.</li>
        <li>If Google says app passwords aren't available, turn on 2-Step Verification first, or ask IT.</li>
      </ol>
      <div class="row2"><button class="btn sm" data-test="email">Test</button><span class="test-msg"></span><span class="spacer"></span>${gp.source === "settings" ? `<button class="btn sm danger" data-clear="google_app_password">Remove password</button>` : ""}</div>
    </div>`;
  const val = n => $(`#setBody [name=${n}]`).value.trim();
  $("#setBody").querySelectorAll("[data-test]").forEach(b => b.onclick = async () => {
    const msg = b.parentElement.querySelector(".test-msg");
    msg.className = "test-msg"; msg.textContent = "Testing…"; b.disabled = true;
    try {
      const r = await api("/settings/test", { method: "POST", body: { service: b.dataset.test, trellus_api_key: val("trellus_api_key"), trellus_user_email: val("trellus_user_email"), email_address: val("email_address"), google_app_password: val("google_app_password") } });
      msg.className = "test-msg " + (r.ok ? "ok" : "bad"); msg.textContent = (r.ok ? "✓ " : "✗ ") + r.message;
    } catch (e) { msg.className = "test-msg bad"; msg.textContent = e.message; }
    b.disabled = false;
  });
  $("#setBody").querySelectorAll("[data-clear]").forEach(b => b.onclick = () => saveSettings({ clear: [b.dataset.clear] }, "Removed"));
  $("#setBody").querySelectorAll("input").forEach(i => i.onkeydown = e => { if (e.key === "Enter") { e.preventDefault(); saveSettings(); } });
}
async function saveSettings(extra, msg) {
  const body = extra || {};
  if (!extra) for (const n of ["trellus_user_email", "trellus_api_key", "email_address", "google_app_password"]) {
    const el = $(`#setBody [name=${n}]`); if (!el || el.disabled) continue;
    if (el.type !== "password" || el.value.trim()) body[n] = el.value.trim();
  }
  try {
    setData = await api("/settings", { method: "POST", body });
    paintSettings(); checkSetup();
    toast(msg || "Saved. Syncing now…");
    setTimeout(() => { loadSync(); loadMail(); }, 1500);
  } catch (e) { toast(e.message); }
}
$("#setBtn").onclick = openSettings;
$("#setClose").onclick = closeSettings;
$("#setScrim").onclick = closeSettings;
$("#setSave").onclick = () => saveSettings();

// ---------- Team (managers) ----------
let teamRange = localGet("teamRange") || "week";
async function renderTeam() {
  const [a, b] = rangeDates(teamRange).map(ymd);
  $("#view").innerHTML = `<div class="toolbar"><select id="teamRangeSel">${RANGES.filter(([k]) => k !== "all").map(([k, l]) => `<option value="${k}" ${k === teamRange ? "selected" : ""}>${l}</option>`).join("")}</select>
    <span class="hint">${fmtDate(a)} – ${fmtDate(b)} · everyone on the tracker. Click a person to see their pipeline (read-only).</span></div><div class="hint">Loading…</div>`;
  $("#teamRangeSel").onchange = e => { teamRange = e.target.value; localSet("teamRange", teamRange); renderTeam(); };
  let d;
  try { d = await api(`/team?from=${a}&to=${b}`); } catch (e) { $("#view").lastElementChild.textContent = e.message; return; }
  if (view !== "team") return;
  const cols = [["dials", "Dials"], ["connects", "Connects"], ["lead", "Interested"], ["info_sent", "Info sent"], ["submission", "Submissions"], ["quoted", "Quoted"], ["active", "Appointed"], ["bound_premium", "Bound premium"]];
  const sum = k => d.people.reduce((n, p) => n + (p.totals[k] || 0), 0);
  const pct = (x, y) => y ? Math.round(100 * x / y) + "%" : "—";
  const openDeals = p => ["lead", "info_sent", "submission", "quoted"].reduce((n, k) => n + (p.stages[k] || 0), 0);
  const cell = (k, v) => k === "bound_premium" ? (v ? money(v) : '<span class="hint">—</span>') : (v || '<span class="hint">0</span>');
  $("#view").lastElementChild.outerHTML = `<table class="team"><thead><tr><th>Person</th>${cols.map(([, l]) => `<th>${l}</th>`).join("")}<th>Connect %</th><th>Open deals</th><th>Open to-dos</th><th>Syncs</th></tr></thead><tbody>
    ${d.people.map(p => `<tr class="row" data-as="${esc(p.email)}">
      <td class="who"><b>${esc(p.email)}${p.email === me.email ? " (you)" : ""}</b><span class="hint">${p.last_seen ? "Last on " + fmtDateTime(p.last_seen) : ""}</span></td>
      ${cols.map(([k]) => `<td>${cell(k, p.totals[k])}</td>`).join("")}
      <td>${pct(p.totals.connects, p.totals.dials)}</td><td>${openDeals(p)}</td><td>${p.open_tasks || '<span class="hint">0</span>'}</td>
      <td>${p.trellus ? "📞" : '<span class="hint" title="Trellus not connected">📞✗</span>'} ${p.email_sync ? "✉️" : '<span class="hint" title="Email not connected">✉️✗</span>'}${p.sync_error ? ' <span class="tag over" title="Last sync failed">⚠</span>' : ""}</td></tr>`).join("") || `<tr><td colspan="13" class="empty">Nobody has opened the tracker yet.</td></tr>`}
    ${d.people.length > 1 ? `<tr class="total"><td>Team</td>${cols.map(([k]) => `<td>${cell(k, sum(k))}</td>`).join("")}<td>${pct(sum("connects"), sum("dials"))}</td><td>${d.people.reduce((n, p) => n + openDeals(p), 0)}</td><td>${d.people.reduce((n, p) => n + p.open_tasks, 0)}</td><td></td></tr>` : ""}
    </tbody></table>`;
  document.querySelectorAll("tr[data-as]").forEach(tr => tr.onclick = () => viewAs(tr.dataset.as === me.email ? null : tr.dataset.as));
}
async function viewAs(email) {
  viewingAs = email;
  document.body.classList.toggle("readonly", !!email);
  $("#viewBar").hidden = !email; $("#viewWho").textContent = email || "";
  $("#csvLink").href = "/api/export.csv" + (email ? "?as=" + encodeURIComponent(email) : "");
  document.querySelectorAll(".counter input").forEach(i => i.disabled = !!email);
  closeDrawer();
  view = email ? "board" : "team"; localSet("view", view);
  await Promise.all([load(), loadToday(), loadSync(), loadMail()]);
}
$("#viewBack").onclick = () => viewAs(null);
window.addEventListener("unhandledrejection", e => { if (e.reason?.message) toast(e.reason.message); });

loadMe().then(() => { load(); loadToday(); loadSync(); loadMail(); });
</script>
</body>
</html>
